version: '3'
services:
  claude-wrapper:
    build:
      context: .
      args:
        # Match the in-container user to your host UID/GID so the ~/.claude
        # bind-mount is readable/writable. Override via env or .env file.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      # Host port is configurable (override via PORT env / .env file);
      # container always listens on 8000.
      - "${PORT:-8000}:8000"
    volumes:
      # Host path for Claude credentials. Default ~/.claude works for local
      # shells; under Portainer (where compose runs as the docker daemon user,
      # usually root) set CLAUDE_CONFIG_DIR to an absolute path you control
      # and chown it to match UID/GID above.
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/appuser/.claude
      # Optional: Mount a specific workspace directory
      # Uncomment and modify the line below to use a custom workspace
      # - ./workspace:/workspace
    # Optional: Set Claude's working directory (defaults to isolated temp dir)
    # environment:
    #   - CLAUDE_CWD=/workspace
